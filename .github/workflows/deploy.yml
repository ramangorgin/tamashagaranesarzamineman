name: 🚀 Auto Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v3

    - name: 🚀 Deploy to VPS via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script_stop: true
        script: |
         echo "📌 Starting Deployment..."

          cd /var/www/tamashagaranesarzamineman

          echo "📌 Marking directory as safe for git..."
          git config --global --add safe.directory /var/www/tamashagaranesarzamineman


          echo "📌 Pulling latest code..."
          git pull origin main

          echo "📌 Installing composer dependencies..."
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

          echo "📌 Running migrations..."
          php artisan migrate --force

          echo "📌 Clearing cache..."
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          echo "📌 Optimizing Laravel..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize

          echo "📌 Cleaning untracked JSON files..."
          rm -f public/data/provinces*.json


          echo "📌 Checking storage link..."
          if [ ! -L "public/storage" ]; then
              php artisan storage:link
          fi

          echo "📌 Restarting PHP FPM..."
          sudo systemctl restart php8.2-fpm

          echo "🎉 Deployment Completed Successfully!"
